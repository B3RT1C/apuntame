<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <form [formGroup]="categoryForm">
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput data-testid="category-name-input" formControlName="name" required>
      @if (categoryForm.get('name')?.hasError('required')) {
        <mat-error>El nombre es requerido</mat-error>
      }
      @if (categoryForm.get('name')?.hasError('minlength')) {
        <mat-error>El nombre debe tener al menos 2 caracteres</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" data-testid="category-submit-btn" (click)="onSubmit()" [disabled]="categoryForm.invalid">
    {{ isEditMode ? 'Actualizar' : 'Crear' }}
  </button>
</mat-dialog-actions>
