<div class="take-order-container" data-testid="take-order-page">
  <div class="header-container">
    <mat-form-field class="table-field">
      <mat-label>Mesa</mat-label>
      <input matInput data-testid="table-input" [(ngModel)]="tableNumber">
    </mat-form-field>

    <div class="action-buttons">
      <button mat-icon-button (click)="toggleCardSize()" class="size-button" [class.active]="cardSize !== 'normal'">
        <mat-icon>{{ cardSize === 'normal' ? 'view_module' : cardSize === 'large' ? 'view_compact' : 'view_comfy' }}</mat-icon>
      </button>

      <button mat-icon-button (click)="openCategoryFilterDialog()" class="filter-button">
        <mat-icon>settings</mat-icon>
      </button>
    </div>
  </div>

  <div class="layout">
    <div class="items-section">

      @if (loading) {
        <p>Cargando productos...</p>
      } @else {
        <div class="items-grid"
             [class.compact]="cardSize === 'compact'"
             [class.large]="cardSize === 'large'">
          @for (item of items; track item.id) {
            <mat-card (click)="addItemToOrder(item)"
                      class="item-card"
                      [attr.data-testid]="'item-card-' + item.name"
                      [class.compact]="cardSize === 'compact'"
                      [class.large]="cardSize === 'large'">
              <mat-card-content>
                <div class="item-name">{{ item.name }}</div>
                <div class="item-price">{{ item.price | number:'1.2-2' }}€</div>
              </mat-card-content>
            </mat-card>
          }
        </div>
      }
    </div>

    <mat-card class="summary">
      <mat-card-header>
        <mat-card-title>Pedido Actual</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <app-order-summary
          [orderItems]="orderItems"
          [showTotal]="true"
          [editable]="true"
          (addItem)="addItemToOrder($event)"
          (removeItem)="removeItemFromOrder($event)">
        </app-order-summary>

        <div class="footer">
          <button mat-raised-button color="primary" data-testid="send-order-btn" (click)="sendOrder()"
                  [disabled]="orderItems.length === 0 || !tableNumber">
            Enviar Pedido
          </button>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
