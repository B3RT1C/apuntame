<div mat-dialog-title>
  <h2>Pedido #{{ order.id }} - Mesa {{ order.table }}</h2>
  <button mat-icon-button (click)="close()" class="close-button">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content>
  <app-order-summary
    [orderItems]="order.orderItems"
    [showTotal]="true"
    [editable]="true"
    (addItem)="onAddItem($event)"
    (removeItem)="onRemoveItem($event)">
  </app-order-summary>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button (click)="close()">
    Cancelar
  </button>
  <button mat-raised-button color="primary" data-testid="edit-order-confirm-btn" (click)="confirm()" [disabled]="!hasChanges()">
    Confirmar
  </button>
</mat-dialog-actions>
