<nav class="bottom-nav">
  @for (item of menuItems; track item.route) {
    <button mat-button (click)="itemClicked.emit(item.route)" class="bottom-nav-item">
      <div class="nav-content">
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </div>
    </button>
  }
</nav>
