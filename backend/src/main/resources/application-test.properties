# Perfil Spring para pruebas automatizadas (Docker CI / local)

spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:apuntame}
spring.datasource.username=${DB_USER:apuntame_test}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.level.root=INFO
logging.level.com.apuntame.backend=INFO

apuntame.initialize-demo-data=${INITIALIZE_DEMO_DATA:true}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
